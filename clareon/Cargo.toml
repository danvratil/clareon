[package]
name = "clareon"
description = "Qt/QML GUI for Clareon - AI assistant for Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build/main.rs"

[dependencies]
# Core library
clareon-core = { path = "../clareon-core" }

# Qt bindings
clareon-qt = { path = "../clareon-qt" }

# CXX-Qt bridge
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
cxx-qt-lib-extras = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "io-util"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true }

# Time handling
chrono = { workspace = true }

# Encoding
base64 = "0.22"

# Standard directory lookups (used by clareon::standard_dirs on Windows)
directories = { workspace = true }
clap.workspace = true

[target.'cfg(unix)'.dependencies]
# XDG Base Directory support (used by clareon::standard_dirs on Unix)
xdg = "3.0"

[target.'cfg(windows)'.dependencies]
# Used for the Win32 named-mutex primitive in unique_app::windows.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[features]
qml-from-filesystem = []

[build-dependencies]
cxx-qt-build = { workspace = true }
glob = "0.3"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
#cmake-package = { workspace = true }
qt-build-utils = { workspace = true }
