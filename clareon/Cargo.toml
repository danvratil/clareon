[package]
name = "clareon"
description = "Qt/QML GUI for Clareon - Claude assistant for Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build/main.rs"

[dependencies]
# Core library
clareon-core = { path = "../clareon-core" }

# Qt bindings
clareon-qt = { path = "../clareon-qt" }

# CXX-Qt bridge
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
cxx-qt-lib-extras = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "io-util"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-core = { workspace = true }
tracing-subscriber = { workspace = true }

# Time handling
chrono = { workspace = true }

# Encoding
base64 = "0.22"

# XDG Base Directory support
xdg = "3.0"
clap.workspace = true

[build-dependencies]
cxx-qt-build = { workspace = true }
glob = "0.3"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
