[workspace]
resolver = "2"
members = [
    "clareon-core",
    "clareon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daniel Vratil <dvratil@kde.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dvratil/clareon"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"

# HTTP client (for Anthropic API)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Secrets (rt-tokio-crypto-rust uses tokio runtime with pure Rust crypto)
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }

# Configuration paths
directories = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
