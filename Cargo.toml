[workspace]
resolver = "2"
members = [
    "clareon-core",
    "clareon-qt",
    "clareon",
    "mock-anthropic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Daniel Vratil <me@dvratil.cz>"]
license = "GPL-3.0-or-later"
repository = "https://codeberg.ogr/danvratil/clareon"
homepage = "https://clareon.cc"
keywords = [
    "ai",
    "assistant",
    "desktop",
    "llm",
]
categories = [
    "artificial-intelligence",
]
publish = false


[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"
aws-smithy-types = "1"

# OpenAI-compatible API
async-openai = { version = "0.36", features = ["chat-completion", "model"] }

# OpenRouter native API
openrouter-rs = "0.9"

# HTTP client (for Anthropic API)
reqwest = { version = "0.13", features = ["json", "stream"] }

# Secrets (rt-tokio-crypto-rust uses tokio runtime with pure Rust crypto)
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }

# Configuration paths
directories = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Qt/QML integration
cxx = "1.0"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_full"] }
cxx-qt-lib-extras = "0.8"
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }

# Base64 encoding
base64 = "0.22"

# Build dependencies
cmake-package = "0.1"
